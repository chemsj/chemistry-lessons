}

function reload(){
  // showUnitCellInfo off — 세포 상자를 켜도 공간군·격자상수 글자는 띄우지 않는다(성취기준 범위 밖)
  var s = 'set echo off; set showUnitCellInfo false; measure delete; load DATA "cif"\n' + M.cif + '\nEND "cif" {' + S.pack + '}'
        + (S.packed ? ' packed' : '') + ';';
  if (M.post) s += ' ' + M.post;
  s += viewCmd();
  Jmol.script(jmolApplet0, s);
  paint();
}
function apply(){ Jmol.script(jmolApplet0, viewCmd()); paint(); }

function show(id){
  var m = mat(id); if (!m) return;
  if (!ready){ pending = id; return; }
  M = m; S = defaults(m, S && S.light);
  reload();
}
function reset(){ if (M) show(M.id); }

function setPack(p){ if(!M) return; S.pack = p; S.slid = false; reload(); }
function setSf(v){ if(!M) return; S.sf = v; apply(); }
function setWf(v){ if(!M) return; S.wf = v; apply(); }
function toggle(k){
  if(!M) return;
  if (k === 'hydro' && !M.hydro) return;
  if (k === 'bonds' && !M.bond) return;
  S[k] = !S[k];
  if (k === 'packed'){ S.slid = false; reload(); } else apply();
}

// 반 층 밀기 — 격자상수와 현재 반복 수로 좌표를 계산한다(y 절반 위를 x로 a/2 만큼)
function slide(dir){
  if (!M || !M.slide){ alert('밀기 데모는 이온 결정(염화 나트륨·산화 마그네슘)과 금속 결정에서 씁니다.'); return; }
  if (dir > 0 && S.slid) return;
  if (dir < 0 && !S.slid) return;
  var n = parseInt(S.pack.split(' ')[1], 10) || 1;
  var half = (M.a * n / 2).toFixed(2), d = (dir * M.a / 2).toFixed(3);
  S.slid = (dir > 0);
  var sc = 'select y > ' + half + '; translateSelected {' + d + ' 0 0}; select none;';
  if (M.bond && S.bonds) sc += ' ' + M.bond.off + '; ' + M.bond.on + ';';  // 새 위치로 다시 긋는다
  Jmol.script(jmolApplet0, sc);
  paint();
}

function paint(){
  document.getElementById('fName').textContent = M.no + '. ' + M.name;
  document.getElementById('fPoint').textContent = M.point;
  document.getElementById('fCod').textContent = 'COD ' + M.cod + ' · CC0';
  var c = 'load "" {' + S.pack + '}' + (S.packed ? ' packed' : '') + '; spacefill ' + S.sf + '%; wireframe '
        + (S.wf > 0 ? S.wf : 'off') + ';';
  if (S.cell) c += ' unitcell on;';
  if (M.hydro && !S.hydro) c += ' hide hydrogen;';
  if (M.bond && S.bonds) c += ' ' + M.bond.on + ';';
  if (S.labels) c += ' label %e;';
  if (S.spin) c += ' spin on;';
  if (S.slid) c += ' (반 층 밀린 상태)';
  document.getElementById('cmd').textContent = c;

  var bs = document.querySelectorAll('#bar button');
  for (var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.id === M.id);
  function set(id, on, dim){
    var b = document.getElementById(id); if(!b) return;
    b.classList.toggle('on', !!on); b.classList.toggle('dim', !!dim);
  }
  set('p1', S.pack==='1 1 1'); set('p2', S.pack==='2 2 2'); set('p3', S.pack==='3 3 3');
  set('bPacked', S.packed); set('bCell', S.cell);
  set('s15', S.sf===15); set('s25', S.sf===25); set('s45', S.sf===45); set('s60', S.sf===60); set('s100', S.sf===100);
  set('w0', S.wf===0); set('w15', S.wf===0.15); set('w30', S.wf===0.3);
  set('bBond', M.bond && S.bonds, !M.bond);
  set('bHydro', M.hydro && S.hydro, !M.hydro);
  set('bLabel', S.labels); set('bSpin', S.spin); set('bLight', S.light);
  set('bSlide', S.slid, !M.slide);
  var bb = document.getElementById('bBond');
  if (bb) bb.textContent = M.bond ? M.bond.label : '결합선';
}

// 물질 버튼 — 4묶음으로 나눠 그린다
(function(){
  var host = document.getElementById('bar');
  for (var g=0; g<GROUPS.length; g++){
    var key = GROUPS[g][0];
    if (g) { var sp = document.createElement('div'); sp.className = 'sep'; host.appendChild(sp); }
    var lab = document.createElement('span'); lab.className = 'gl'; lab.textContent = GROUPS[g][1];
    host.appendChild(lab);
    for (var i=0;i<MATERIALS.length;i++){
      var m = MATERIALS[i]; if (m.group !== key) continue;
      var b = document.createElement('button');
      b.textContent = m.no + ' ' + m.name; b.dataset.id = m.id; b.className = 'g' + m.group;
      (function(id){ b.onclick = function(){ show(id); }; })(m.id);
      host.appendChild(b);
    }
  }
})();

document.addEventListener('keydown', function(e){
  var i = -1;
  if (e.key >= '1' && e.key <= '9') i = +e.key - 1;
  else if (e.key === '0') i = 9;
  else if (e.key === '-') i = 10;
  else if (e.key === 'ArrowRight' && M) i = Math.min(MATERIALS.length-1, M.no);
  else if (e.key === 'ArrowLeft' && M) i = Math.max(0, M.no - 2);
  if (i >= 0 && MATERIALS[i]) show(MATERIALS[i].id);
});

var Info = {
  width: "100%", height: "100%", use: "HTML5",
  j2sPath: "https://chemapps.stolaf.edu/jmol/jsmol/j2s",
  serverURL: "https://chemapps.stolaf.edu/jmol/jsmol/php/jsmol.php",
  antialiasDisplay: true, disableInitialConsole: true, disableJ2SLoadMonitor: true,
  readyFunction: function(){ ready = true; document.getElementById("loading").style.display = "none";
                             show(pending || "ice"); },
  script: ""
};
$("#viewer").html(Jmol.getAppletHtml("jmolApplet0", Info));
</script>
